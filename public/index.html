<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1527" media="(prefers-color-scheme: dark)">
<title>回家之旅</title>
<style>
/* 布局：单列手机竖屏。顶部实时位置，其后总览图、每日行程（可展开路线图）、待办放在最后。 */
:root {
  --bg: #eef1f6; --card: #fcfdff; --ink: #18233d; --mut: #5b6784; --line: #d5dbe7; --soft: #e4e9f2;
  --ground: #b9770e; --f1: #12766f; --f2: #3a4db5; --t1: #8a3fa6; --t2: #c4342b; --xfer: #6b7792;
  --warn: #8a5400; --warn-bg: #f7e9cc; --ok: #12766f; --ok-bg: #d9ecea; --bad: #b3261e; --bad-bg: #f6dedb;
  --sea: #e3eaf5;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1527; --card: #182038; --ink: #e9edf7; --mut: #9aa7c4; --line: #2a3452; --soft: #222c49;
    --ground: #f0b45a; --f1: #4ec5b9; --f2: #8b9cff; --t1: #cf8be6; --t2: #ff7a6c; --xfer: #8f9bb8;
    --warn: #f0b95a; --warn-bg: #3d2f12; --ok: #4ec5b9; --ok-bg: #153a39; --bad: #ff8a80; --bad-bg: #4a2227;
    --sea: #131c33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1527; --card: #182038; --ink: #e9edf7; --mut: #9aa7c4; --line: #2a3452; --soft: #222c49;
  --ground: #f0b45a; --f1: #4ec5b9; --f2: #8b9cff; --t1: #cf8be6; --t2: #ff7a6c; --xfer: #8f9bb8;
  --warn: #f0b95a; --warn-bg: #3d2f12; --ok: #4ec5b9; --ok-bg: #153a39; --bad: #ff8a80; --bad-bg: #4a2227;
  --sea: #131c33; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
h1, h2 { font-family: var(--serif); text-wrap: balance; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--f2); outline-offset: 2px; }

/* 页头 */
.hero { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; user-select: none; -webkit-user-select: none; }
.eyebrow { font: 12px/1.4 var(--mono); letter-spacing: .12em; color: var(--mut); }
h1 { font-size: 42px; line-height: 1.12; font-weight: 900; letter-spacing: .04em; }
h1 b { color: var(--t2); font-weight: 900; }
.sub { color: var(--mut); font-size: 14px; }

/* 现在 */
.now { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.now .k { font-size: 12px; letter-spacing: .08em; opacity: .7; }
.now .where { font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.now .detail { font-size: 14px; opacity: .85; }
.clocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.clock { background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 6px; text-align: center; min-width: 0; }
.clock .c { font: 500 17px/1.3 var(--mono); }
.clock .l { font-size: 11px; opacity: .75; }
.clock.here { background: rgba(255,255,255,.2); }
.cd { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 12px; }
.cd .lab { font-size: 13px; opacity: .85; min-width: 0; }
.cd .lab small { display: block; opacity: .75; font-size: 12px; }
.cd .num { font: 500 18px/1.2 var(--mono); white-space: nowrap; }
.bar { position: relative; display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.12); gap: 1px; }
.bar i { display: block; height: 100%; }
.bar-wrap { position: relative; }
.bar-pin { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.bar-cap { display: flex; justify-content: space-between; font-size: 11px; opacity: .7; margin-top: 4px; }

/* 卡片通用 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 19px; }
.note { font-size: 12.5px; color: var(--mut); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 5px; border-radius: 3px; background: var(--c); display: inline-block; }

/* 地图 */
.map { width: 100%; height: auto; display: block; border-radius: 14px; background: var(--sea); }
.map text { font-family: var(--sans); fill: var(--ink); }
.map .grid { stroke: var(--line); stroke-width: 1; opacity: .8; }
.map .arc { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .28; }
.map .arc-on { fill: none; stroke-width: 3; stroke-linecap: round; }
.map .stop { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.map a { cursor: pointer; }
.map .lab { font-size: 14px; font-weight: 700; }
.map .lab2 { font-size: 11px; fill: var(--mut); }
.me circle.core { fill: var(--t2); stroke: #fff; stroke-width: 2.5; }
.me circle.ring { fill: none; stroke: var(--t2); stroke-width: 2; opacity: .6; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .8; } to { transform: scale(2.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .me circle.ring { animation: none; } }

/* 每日 */
.day { background: var(--card); border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.day-h { padding: 16px 16px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.day-h .dd { font: 12px/1.4 var(--mono); letter-spacing: .06em; color: var(--mut); }
.day-h h2 { font-size: 21px; line-height: 1.3; }
.tzchip { font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.day.today { border-color: var(--t2); box-shadow: 0 0 0 1px var(--t2); }
.day-b { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
details.route { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
details.route > summary { list-style: none; cursor: pointer; padding: 11px 14px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
details.route > summary::-webkit-details-marker { display: none; }
details.route > summary::after { content: "展开 ▾"; font-weight: 400; color: var(--mut); font-size: 13px; }
details.route[open] > summary::after { content: "收起 ▴"; }
.line { list-style: none; padding: 4px 14px 14px; display: flex; flex-direction: column; }
.n { display: grid; grid-template-columns: 62px 22px 1fr; gap: 0 8px; min-width: 0; position: relative; }
.n .time { font: 500 15px/1.3 var(--mono); text-align: right; padding-top: 2px; }
.n .time small { display: block; font-size: 10.5px; color: var(--mut); font-weight: 400; }
.n .rail { position: relative; display: flex; justify-content: center; }
.n .rail::before { content: ""; position: absolute; top: 12px; bottom: -4px; width: 5px; border-radius: 3px; background: var(--c, var(--xfer)); opacity: .35; }
.n:last-child .rail::before { display: none; }
.n .dot { position: relative; margin-top: 5px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--c, var(--xfer)); background: var(--card); z-index: 1; }
.n .body { padding-bottom: 14px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.n .body b { font-size: 15px; line-height: 1.4; }
.n .desc { font-size: 13px; color: var(--mut); }
.n .addr { font-size: 12.5px; color: var(--mut); overflow-wrap: anywhere; }
.n .cdn { font: 12px/1.4 var(--mono); color: var(--mut); }
.n.is-next .cdn { color: var(--t2); font-weight: 700; }
.cdt { font-weight: 700; }
.n .bjt { font: 11.5px/1.4 var(--mono); color: var(--mut); }
.n.is-done .dot { background: var(--c, var(--xfer)); }
.n.is-done .body b { color: var(--mut); }
.n .here { display: none; align-self: flex-start; font-size: 12px; font-weight: 700; color: #fff; background: var(--t2); border-radius: 999px; padding: 1px 10px; margin-top: 4px; }
.n.is-now .here { display: inline-block; }
.n.is-now .dot { background: var(--t2); border-color: var(--t2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--t2) 25%, transparent); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; min-height: 34px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; text-decoration: none; cursor: pointer; }
.btn.go { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 机票 */
.tkt { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tkt-h { background: var(--c); color: #fff; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.tkt-h b { font: 700 16px/1.2 var(--mono); }
.tkt-h span { text-align: right; min-width: 0; }
.tkt-r { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 14px 14px 6px; align-items: start; }
.end { display: flex; flex-direction: column; min-width: 0; }
.end.r { text-align: right; }
.end .t { font: 500 26px/1.15 var(--mono); }
.end .dt { font-size: 12px; color: var(--mut); }
.end .ap { font: 700 18px/1.3 var(--mono); margin-top: 4px; }
.end .an { font-size: 12.5px; color: var(--mut); }
.mid { text-align: center; font-size: 12px; color: var(--mut); padding-top: 8px; }
.mid b { display: block; color: var(--ink); font: 500 13px/1.4 var(--mono); }
.tkt dl { padding: 4px 14px 14px; display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; font-size: 13px; }
.tkt dt { color: var(--mut); }
.tkt dd { min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.wait { background: var(--warn-bg); color: var(--warn); }
.plan { display: flex; flex-direction: column; gap: 8px; }
.pl { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; background: var(--bg); }
.pl .pill { margin-right: 6px; }
.slack { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; background: var(--ok-bg); }
.slack.tight { background: var(--warn-bg); }
.slack b { font-weight: 700; }
.slack ul { padding-left: 18px; margin-top: 4px; }

/* 天气和提醒 */
.wx { display: flex; flex-direction: column; gap: 8px; }
.wx-r { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; background: var(--bg); border-radius: 14px; padding: 12px; }
.wx-r .deg { font: 500 22px/1.2 var(--mono); }
.wx-r .deg small { display: block; font: 11.5px/1.4 var(--sans); color: var(--mut); }
.wx-r .wear { font-size: 14px; }
.wx-r .wear small { display: block; font-size: 12.5px; color: var(--mut); }
.tips h3 { font-size: 14px; margin-bottom: 4px; }
.tips ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.warn { background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.warn ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.warn h3 { font-size: 14px; }

/* 待办 */
.todo { list-style: none; display: flex; flex-direction: column; }
.todo li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; }
.todo input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 1px 0 0; border: 2px solid var(--mut); border-radius: 7px; background: var(--bg); display: grid; place-items: center; }
.todo input:checked { background: var(--t2); border-color: var(--t2); }
.todo input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.todo input:disabled { opacity: 1; }
.todo label { min-width: 0; font-size: 14.5px; }
.todo small { display: block; color: var(--mut); font-size: 12.5px; line-height: 1.5; }
.todo li.done label > span { color: var(--mut); text-decoration: line-through; text-decoration-color: var(--line); }
.prog { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--t2); transition: width .25s; }
.owner { font-size: 12px; color: var(--ok); }
.foot { text-align: center; font-size: 12px; color: var(--mut); padding: 4px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="title">
    <p class="eyebrow">YUL → CMN → PKX → 鹤壁东</p>
    <h1>回<b>家</b>之旅</h1>
    <p class="sub">2026 年 11 月 17 日 至 19 日 · 蒙特利尔 → 鹤壁</p>
  </header>

  <section class="now" aria-live="polite">
    <span class="k">此刻</span>
    <div class="where" id="nowWhere">—</div>
    <div class="detail" id="nowDetail"></div>
    <div class="clocks" id="clocks"></div>
    <div class="cd"><div class="lab" id="cdLab"></div><div class="num" id="cdNum"></div></div>
    <div class="cd"><div class="lab" id="homeLab"></div><div class="num" id="homeNum"></div></div>
    <div>
      <div class="bar-wrap"><div class="bar" id="bar"></div><div class="bar-pin" id="pin"></div></div>
      <div class="bar-cap"><span>11/17 蒙特利尔出发</span><span>11/19 鹤壁东</span></div>
    </div>
  </section>

  <section class="card">
    <h2>行程总览</h2>
    <div class="legend" id="legend"></div>
    <svg class="map" id="mapWorld" viewBox="0 0 400 230" role="img" aria-label="蒙特利尔到卡萨布兰卡到北京的航线示意图"></svg>
    <svg class="map" id="mapBJ" viewBox="0 0 400 330" role="img" aria-label="北京大兴机场到北京西站到鹤壁东站的高铁示意图"></svg>
    <p class="note">示意图，不按比例。点击地点会在手机的地图里打开：国外用谷歌地图，北京和鹤壁用百度地图，点卡萨布兰卡会显示 T1 与 T2 之间的步行路线。红点是按时刻表推算出的当前位置。</p>
  </section>

  <div id="days" style="display:contents"></div>

  <section class="card" id="todoCard">
    <h2>待办清单</h2>
    <div class="prog"><i id="todoBar"></i></div>
    <div class="note" id="todoNote"></div>
    <ul class="todo" id="todo"></ul>
  </section>

  <p class="foot">所有时间均为当地时间，并标注时区。页面不含订单号、护照信息和二维码。</p>
</div>

<script>
(function () {
  "use strict";
  var MIN = 60000;

  /* ---------- 时区：固定偏移，不依赖手机的时区数据库 ---------- */
  var Z = {
    mtl: { off: -300, city: "蒙特利尔", utc: "UTC−5" },
    cmn: { off: 0, city: "卡萨布兰卡", utc: "UTC+0" },
    bj: { off: 480, city: "北京", utc: "UTC+8" }
  };
  var WD = ["日", "一", "二", "三", "四", "五", "六"];
  function T(s) { return Date.parse(s); }
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function parts(ms, z) { var d = new Date(ms + Z[z].off * MIN); return { mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), wd: d.getUTCDay() }; }
  function hm(ms, z) { var p = parts(ms, z); return p2(p.h) + ":" + p2(p.mi); }
  function md(ms, z) { var p = parts(ms, z); return p.mo + "月" + p.d + "日"; }
  function mdw(ms, z) { return md(ms, z) + " 周" + WD[parts(ms, z).wd]; }
  function dayShift(ms, fromZ, toZ) { return parts(ms, toZ).d - parts(ms, fromZ).d; }
  function dur(ms) { var m = Math.round(ms / MIN), h = Math.floor(m / 60); return h ? h + " 小时 " + p2(m % 60) + " 分" : m + " 分钟"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ---------- 时刻表（全部用带偏移的绝对时间） ---------- */
  var E = {
    leave: T("2026-11-17T16:45:00-05:00"),
    yul: T("2026-11-17T17:40:00-05:00"),
    dep1: T("2026-11-17T20:40:00-05:00"),
    arr1: T("2026-11-18T08:15:00+00:00"),
    t1: T("2026-11-18T12:20:00+00:00"),
    dep2: T("2026-11-18T15:20:00+00:00"),
    arr2: T("2026-11-19T11:55:00+08:00"),
    jd: T("2026-11-19T14:35:00+08:00"),
    gate: T("2026-11-19T16:34:00+08:00"),
    g3942: T("2026-11-19T16:54:00+08:00"),
    bjw: T("2026-11-19T17:28:00+08:00"),
    g555: T("2026-11-19T19:14:00+08:00"),
    home: T("2026-11-19T22:01:00+08:00")
  };

  /* ---------- 地点 ---------- */
  var P = {
    home: { n: "900 rue Saint-Jacques", a: "900 rue Saint-Jacques, Montréal, QC, Canada", q: "900 rue Saint-Jacques, Montréal", ll: "45.5017,-73.5673" },
    yul: { n: "蒙特利尔-特鲁多国际机场 YUL", a: "975 Boulevard Roméo-Vachon Nord, Dorval, QC H4Y 1H1, Canada", q: "Montréal-Pierre Elliott Trudeau International Airport", gq: "Montréal–Trudeau International Airport (YUL)", ll: "45.4706,-73.7408" },
    cmn2: { n: "卡萨布兰卡穆罕默德五世国际机场 T2", a: "Aéroport Mohammed V, Nouaceur, Casablanca, Maroc（Terminal 2）", q: "Aéroport Mohammed V Casablanca Terminal 2", gq: "Mohammed V International Airport Terminal 2, Casablanca", ll: "33.3675,-7.5898" },
    cmn1: { n: "卡萨布兰卡穆罕默德五世国际机场 T1", a: "Aéroport Mohammed V, Nouaceur, Casablanca, Maroc（Terminal 1）", q: "Aéroport Mohammed V Casablanca Terminal 1", gq: "Mohammed V International Airport Terminal 1, Casablanca", ll: "33.3675,-7.5898" },
    pkx: { n: "北京大兴国际机场 PKX", a: "北京市大兴区，北京大兴国际机场", q: "北京大兴国际机场", gq: "Beijing Daxing International Airport", bd: ["北京大兴国际机场", "北京"], ll: "39.5098,116.4105" },

        { t: E.g555, z: "bj", c: "var(--t2)", title: "G555 发车", desc: "2 小时 47 分到鹤壁东", p: P.bjw },
        { t: E.home, z: "bj", c: "var(--t2)", title: "到达鹤壁东站", desc: "回家", p: P.hebi }
      ],
      tickets: [
        {
          no: "G3942", line: "Plan A · 复兴号 · 大兴机场 → 北京西", c: "var(--t1)",
          t0: E.g3942, z0: "bj", c0: "大兴机场", n0: "大兴机场站", t1: E.bjw, z1: "bj", c1: "北京西", n1: "北京西站",
          rows: [["状态", '<span class="pill wait">待购票</span> 12306 显示 16:00 起售（北京时间）'], ["站点", "大兴机场站，北京大兴国际机场旁，步行约 150 米"], ["到站台", "<b>16:34 前</b>到检票口（发车前 20 分钟）"], ["票价", "二等座约 24 元起"]]
        },
        {
          no: "C2726", line: "Plan B · 复兴号 · 大兴机场 → 北京西", c: "var(--t1)",
          t0: T("2026-11-19T17:19:00+08:00"), z0: "bj", c0: "大兴机场", n0: "大兴机场站", t1: T("2026-11-19T17:47:00+08:00"), z1: "bj", c1: "北京西", n1: "北京西站",
          rows: [["状态", '<span class="pill wait">待购票</span> 12306 显示 16:00 起售（北京时间）'], ["用途", "只在 Plan A 赶不上时乘坐。与 G555 之间换乘 1 小时 27 分"], ["到站台", "<b>16:59 前</b>到检票口（发车前 20 分钟）"], ["票价", "二等座约 30 元起"]]
        },
        {
          no: "G555", line: "北京西 → 鹤壁东 · 二等座约 244 元起", c: "var(--t2)",
          t0: E.g555, z0: "bj", c0: "北京西", n0: "北京西站", t1: E.home, z1: "bj", c1: "鹤壁东", n1: "鹤壁东站",
          rows: [["状态", '<span class="pill wait">待购票</span> 12306 显示 8:00 起售（北京时间）'], ["站点", "北京西站，丰台区莲花池东路 118 号；终点鹤壁东站，淇滨区朝歌路"], ["到站台", "<b>18:54 前</b>到检票口（发车前 20 分钟）"]]
        }
      ],
      wx: [["d3a", "北京当天天气"], ["d3b", "鹤壁当天天气（晚上到站）"]],
      tips: ["北京比蒙特利尔快 13 小时，比卡萨布兰卡快 8 小时，落地后把手机作息调到北京时间", "身份证件、12306 账号、取票码放在手机里，离线截图一份", "京东邮寄的单号拍照或截图保存", "到站前告诉家人 22:01 鹤壁东站接站"],
      warns: ["京东在大兴机场的邮寄点位置没有公开资料：落地后问机场服务台，或出发前问京东客服", "大兴机场站和北京西站都要过安检，各留 15 到 20 分钟"],
      slack: true
    }
  ];

  function buildDays() {
    var html = DAYS.map(function (d) {
      var h = '<section class="day" id="' + d.id + '" data-start="' + d.t + '"><header class="day-h"><div><span class="dd">' + mdw(d.t, d.z) + '</span><h2>' + esc(d.title) + '</h2></div><span class="tzchip">' + Z[d.z].utc + '</span></header><div class="day-b">';
      h += '<details class="route"><summary>展开今天的路线图</summary><ol class="line">' + d.nodes.map(node).join("") + '</ol></details>';
      if (d.slack) {
        h += '<div class="plan"><div class="pl"><span class="pill ok">Plan A</span> G3942 大兴机场 16:54 发 → 北京西 17:28 到 → G555 19:14 发。换乘 1 小时 46 分</div>' +
          '<div class="pl"><span class="pill wait">Plan B</span> C2726 大兴机场 17:19 发 → 北京西 17:47 到 → G555 19:14 发。换乘 1 小时 27 分</div>' +
          '<div class="slack tight"><b>怎么选</b><ul>' +
          '<li>京东邮寄 16:05 前办完，走 Plan A。最慢情况下 14:35 办完入境取行李，邮寄 90 分钟办到 16:05，到检票口约有 15 分钟余量</li>' +
          '<li>16:05 到 16:40 之间才办完，走 Plan B，检票口 16:59 前到</li>' +
          '<li>两班都赶不上，在 12306 查大兴机场站之后的车次，最晚要在 18:30 前到北京西</li>' +
          '<li>改签、退票以 12306 规则为准，先确认再操作</li></ul></div></div>';
      }
      h += d.tickets.map(tkt).join("");
      h += d.wx.map(function (w) { return wxBlock(w[0], w[1]); }).join("");
      h += '<div class="tips"><h3>要准备的东西</h3>' + ul(d.tips) + '</div>';
      h += '<div class="warn"><h3>注意</h3>' + ul(d.warns) + '</div>';
      return h + '</div></section>';
    }).join("");
    document.getElementById("days").innerHTML = html;
  }

  /* ---------- 天气与穿衣 ---------- */
  var WX = {
    d1: { lat: 45.5, lon: -73.57, tz: "America/Toronto", date: "2026-11-17", lo: -1, hi: 5, name: "蒙特利尔" },
    d2: { lat: 33.37, lon: -7.59, tz: "Africa/Casablanca", date: "2026-11-18", lo: 13, hi: 21, name: "卡萨布兰卡" },
    d3a: { lat: 39.51, lon: 116.41, tz: "Asia/Shanghai", date: "2026-11-19", lo: -1, hi: 9, name: "北京" },
    d3b: { lat: 35.75, lon: 114.3, tz: "Asia/Shanghai", date: "2026-11-19", lo: 3, hi: 12, name: "鹤壁" }
  };
  function wear(lo, hi) {
    var a, b;
    if (hi <= 0) { a = "厚羽绒服、帽子、手套、围巾"; b = "最低气温很低，里面穿保暖内衣"; }
    else if (hi <= 8) { a = "羽绒服或厚大衣，毛衣，帽子手套"; b = lo < 0 ? "早晚低于零度，手套围巾别忘" : "室内外温差大，里面穿薄一点方便脱"; }
    else if (hi <= 14) { a = "风衣或夹克，长袖打底"; b = lo < 4 ? "早晚偏冷，加一件薄毛衣" : "白天舒适，早晚加一件"; }
    else if (hi <= 21) { a = "长袖加薄外套"; b = "白天稍热，外套随手拿着"; }
    else { a = "短袖或薄长袖，带一件薄外套"; b = "室内空调偏冷"; }
    return { a: a, b: b };
  }
  function renderWx(id, lo, hi, tag) {
    var el = document.querySelector('[data-wx="' + id + '"]'); if (!el) return;
    var w = wear(lo, hi);
    el.innerHTML = '<div class="wx-r"><div class="deg">' + Math.round(lo) + '° 到 ' + Math.round(hi) + '°<small>' + esc(tag) + '</small></div><div class="wear">' + esc(w.a) + '<small>' + esc(w.b) + '</small></div></div>';
  }
  function loadWx() {
    var cache = {}; try { cache = JSON.parse(localStorage.getItem("hb-wx") || "{}"); } catch (e) {}
    Object.keys(WX).forEach(function (id) {
      var w = WX[id], c = cache[id];
      if (c) renderWx(id, c.lo, c.hi, "预报，更新于 " + c.at); else renderWx(id, w.lo, w.hi, "常年气温参考，联网后显示预报");
      if (!window.fetch) return;
      var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ctl) ctl.abort(); }, 7000);
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + w.lat + "&longitude=" + w.lon + "&daily=temperature_2m_max,temperature_2m_min&timezone=" + encodeURIComponent(w.tz) + "&start_date=" + w.date + "&end_date=" + w.date;
      fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) { return r.json(); }).then(function (j) {
        clearTimeout(to);
        var hi = j && j.daily && j.daily.temperature_2m_max && j.daily.temperature_2m_max[0], lo = j && j.daily && j.daily.temperature_2m_min && j.daily.temperature_2m_min[0];
        if (typeof hi !== "number" || typeof lo !== "number") return;
        var n = new Date(); var at = (n.getMonth() + 1) + "月" + n.getDate() + "日 " + p2(n.getHours()) + ":" + p2(n.getMinutes());
        renderWx(id, lo, hi, "预报，更新于 " + at);
        cache[id] = { lo: lo, hi: hi, at: at }; try { localStorage.setItem("hb-wx", JSON.stringify(cache)); } catch (e) {}
      }).catch(function () { clearTimeout(to); });
    });
  }

  /* ---------- 待办 ---------- */
  var TODO = [
    { id: "driver", done: true, t: "约好去蒙特利尔机场的司机", n: "11 月 17 日 16:45 接" },
    { id: "g3942", t: "12306 购买 G3942：大兴机场 → 北京西", n: "11 月 19 日 16:54 发车，12306 显示 16:00 起售（北京时间）" },
    { id: "g555", t: "12306 购买 G555：北京西 → 鹤壁东", n: "11 月 19 日 19:14 发车，12306 显示 8:00 起售（北京时间）" },
    { id: "c2726", t: "12306 同时购买备选 C2726：大兴机场 → 北京西", n: "Plan B，11 月 19 日 17:19 发车，用不上就退票，退票规则以 12306 为准" },
    { id: "jd", t: "向京东确认大兴机场邮寄点营业时间、价格、寄到鹤壁的时效", n: "位置：到达层出来往右走，路过“米村拌饭”（他人转述，现场核实）。页面按 70 到 90 分钟估算" },
    { id: "transit", t: "核对卡萨布兰卡转机要求", n: "在航司官网确认，护照不同要求不同" },
    { id: "bag", t: "值机时确认两段登机牌和行李牌终点", n: "行李牌终点应是北京 PKX" },
    { id: "maps", t: "下载离线地图：谷歌地图下载蒙特利尔、卡萨布兰卡，百度地图下载北京、鹤壁", n: "断网前下载完，并打开一次确认能搜到地点" },
    { id: "save", t: "把行程单、车票截图存到手机相册", n: "离线可看，二维码不要发到公开页" },
    { id: "pack", t: "按天气准备衣物，充电宝放在随身包", n: "见每日的提醒" },
    { id: "share", t: "把本页网址发给家人", n: "他们能看到按时刻表推算的位置" }
  ];
  var owner = false; try { owner = localStorage.getItem("hb-owner") === "1"; } catch (e) {}
  var local = {}; try { local = JSON.parse(localStorage.getItem("hb-todo") || "{}"); } catch (e) {}
  function buildTodo() {
    var h = TODO.map(function (x) {
      var on = !!(x.done || local[x.id]);
      return '<li class="' + (on ? "done" : "") + '"><input type="checkbox" id="td-' + x.id + '" data-id="' + x.id + '"' + (on ? " checked" : "") + (owner ? "" : " disabled") + '><label for="td-' + x.id + '"><span>' + esc(x.t) + '</span><small>' + esc(x.n) + '</small></label></li>';
    }).join("");
    document.getElementById("todo").innerHTML = h;
    var done = TODO.filter(function (x) { return x.done || local[x.id]; }).length;
    document.getElementById("todoBar").style.width = Math.round(done / TODO.length * 100) + "%";
    document.getElementById("todoNote").innerHTML = '已完成 <b>' + done + ' / ' + TODO.length + '</b>' + (owner ? ' <span class="owner">· 本机可勾选</span>' : "");
  }
  document.getElementById("todo").addEventListener("change", function (e) {
    var el = e.target; if (!owner || !el.getAttribute("data-id")) return;
    var id = el.getAttribute("data-id"); if (el.checked) local[id] = 1; else delete local[id];
    try { localStorage.setItem("hb-todo", JSON.stringify(local)); } catch (x) {}
    buildTodo();
  });
  (function () {
    var n = 0, t0 = 0, title = document.getElementById("title");
    title.addEventListener("click", function () {
      var now = Date.now(); if (now - t0 > 4000) n = 0; t0 = now; n++;
      if (n >= 7) { n = 0; owner = !owner; try { localStorage.setItem("hb-owner", owner ? "1" : "0"); } catch (e) {} buildTodo(); }
    });
  })();

  /* ---------- 复制 ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-copy]"); if (!b) return;
    var txt = b.getAttribute("data-copy"), old = b.textContent;
    function ok() { b.textContent = "已复制"; setTimeout(function () { b.textContent = old; }, 1500); }
    function fb() {
      var ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (x) {} document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
  });

  /* ---------- 顶部与图例 ---------- */
  function buildTop() {
    document.getElementById("legend").innerHTML = LEGS.map(function (l) { return '<span style="--c:' + l.c + '"><i></i>' + esc(l.t) + '</span>'; }).join("");
    var tot = E.home - E.leave;
    document.getElementById("bar").innerHTML = SEG.map(function (s) { return '<i style="width:' + ((s[1] - s[0]) / tot * 100) + '%;background:' + s[2] + '"></i>'; }).join("");
  }
  function cdText(ms) {
    if (ms <= 0) return "0 秒";
    var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / MIN), sec = Math.floor(ms % MIN / 1000);
    return (d ? d + " 天 " : "") + (d || h ? p2(h) + " 时 " : "") + p2(m) + " 分 " + p2(sec) + " 秒";
  }

  /* ---------- 每秒更新 ---------- */
  function set(id, t) { var e = document.getElementById(id); if (e.textContent !== t) e.textContent = t; }
  function setH(id, h) { var e = document.getElementById(id); if (e.getAttribute("data-h") !== h) { e.innerHTML = h; e.setAttribute("data-h", h); } }
  function setMe(id, xy) { var g = document.getElementById(id); if (!xy) { g.style.display = "none"; return; } g.style.display = ""; g.setAttribute("transform", "translate(" + xy[0].toFixed(1) + " " + xy[1].toFixed(1) + ")"); }
  function dash(id, t) { document.getElementById(id).setAttribute("stroke-dasharray", (t * 100).toFixed(2) + " 100"); }

  function update() {
    var now = Date.now(), ph = phase(now);
    /* 此刻 */
    var title = ph.title, detail = ph.detail;
    if (ph.z === "fly") {
      var pct = clamp((now - ph.start) / (ph.end - ph.start));
      detail = detail + " · 已完成 " + Math.round(pct * 100) + "%，还剩 " + dur(ph.end - now);
    }
    if (ph.i === 10) detail = "11 月 19 日 22:01 到站，到家了";
    set("nowWhere", title); set("nowDetail", detail);
    var cl = ["mtl", "cmn", "bj"].map(function (z) {
      return '<div class="clock' + (ph.z === z ? " here" : "") + '"><div class="c">' + hm(now, z) + '</div><div class="l">' + Z[z].city + ' ' + Z[z].utc + '</div></div>';
    }).join("");
    if (document.getElementById("clocks").getAttribute("data-k") !== cl) { document.getElementById("clocks").innerHTML = cl; document.getElementById("clocks").setAttribute("data-k", cl); }
    if (ph.next) {
      setH("cdLab", esc(ph.next) + "<small>" + md(ph.nextT, ph.nextZ) + " " + hm(ph.nextT, ph.nextZ) + " · " + Z[ph.nextZ].city + " " + Z[ph.nextZ].utc + "</small>");
      set("cdNum", cdText(ph.nextT - now));
    } else { setH("cdLab", "全程结束"); set("cdNum", "到家"); }
    setH("homeLab", "到鹤壁东站<small>11月19日 22:01 · 北京 UTC+8</small>");
    set("homeNum", now >= E.home ? "已到达" : cdText(E.home - now));
    document.getElementById("pin").style.left = (clamp((now - E.leave) / (E.home - E.leave)) * 100) + "%";

    /* 地图 */
    var t1 = clamp((now - E.dep1) / (E.arr1 - E.dep1)), t2 = clamp((now - E.dep2) / (E.arr2 - E.dep2));
    dash("a1on", t1); dash("a2on", t2);
    var w = null, b = null;
    if (now < E.leave) w = W.home;
    else if (now < E.yul) w = lerp(W.home, W.yul, clamp((now - E.leave) / (E.yul - E.leave)));
    else if (now < E.dep1) w = W.yul;
    else if (now < E.arr1) w = bez(A1, t1);
    else if (now < E.dep2) w = W.cmn;
    else if (now < E.arr2) w = bez(A2, t2);
    else {
      w = W.bj;
      if (now < E.g3942) b = I.pkx;
      else if (now < E.bjw) b = lerp(I.pkx, I.bjw, clamp((now - E.g3942) / (E.bjw - E.g3942)));
      else if (now < E.g555) b = I.bjw;
      else if (now < E.home) b = lerp(I.bjw, I.hebi, clamp((now - E.g555) / (E.home - E.g555)));
      else b = I.hebi;
    }
    setMe("meW", w); setMe("meB", b);
    dash("b1on", clamp((now - E.g3942) / (E.bjw - E.g3942)));
    dash("b2on", clamp((now - E.g555) / (E.home - E.g555)));

    /* 所有节点和车票上的倒计时 */
    var cds = document.querySelectorAll("[data-cd]");
    for (var k = 0; k < cds.length; k++) {
      var ms = +cds[k].getAttribute("data-cd") - now;
      var tx = ms <= 0 ? cds[k].getAttribute("data-past") : cds[k].getAttribute("data-pre") + cdText(ms);
      if (cds[k].textContent !== tx) cds[k].textContent = tx;
    }

    /* 每日路线图：已过、当前 */
    var lis = document.querySelectorAll(".n"), cur = -1, i;
    for (i = 0; i < lis.length; i++) if (+lis[i].getAttribute("data-t") <= now) cur = i;
    for (i = 0; i < lis.length; i++) {
      var done = +lis[i].getAttribute("data-t") <= now;
      lis[i].classList.toggle("is-done", done && i !== cur);
      lis[i].classList.toggle("is-now", i === cur && now < E.home + 6 * 3600000);
      lis[i].classList.toggle("is-next", i === cur + 1);
    }
    var days = document.querySelectorAll(".day"), idx = -1;
    for (i = 0; i < DAYS.length; i++) if (now >= DAYS[i].t && (i === DAYS.length - 1 || now < DAYS[i + 1].t)) idx = i;
    for (i = 0; i < days.length; i++) days[i].classList.toggle("today", i === idx && now >= E.leave && now < E.home + 6 * 3600000);
  }

  buildTop(); buildWorld(); buildBJ(); buildDays(); buildTodo(); loadWx(); update();
  setInterval(update, 1000);

  /* 离线缓存 */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { try { navigator.serviceWorker.register("/sw.js").catch(function () {}); } catch (e) {} });
  }
})();
</script>
